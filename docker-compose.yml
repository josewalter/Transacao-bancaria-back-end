version: '3.8'

services:
  # Spring Boot Backend Service
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: banco-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    networks:
      - banco-network
    restart: unless-stopped

  # React Front-end Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: banco-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - banco-network
    restart: unless-stopped

networks:
  banco-network:
    driver: bridge